<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Berry Busy</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div id="widget-container">
      <!-- Start Page -->
      <div id="view-start" class="view active">
        <div id="storefront-bg">
          <div id="bakery-door" onclick="showMenu()"></div>
        </div>
      </div>

      <!-- Menu Page -->
      <div id="view-menu" class="view">
        <div class="menu-header">
          <button class="back-btn" onclick="showView('view-start')">
            ← Exit
          </button>
          <h2>Select Recipe</h2>
        </div>

        <!-- <div class="recipe-card" onclick="selectRecipe()">
          <div class="recipe-icon"></div>
          <span class="recipe-name"></span>
        </div> -->

        <div class="recipe-grid">
          <div class="recipe-card" onclick="selectRecipe('Baguette')">
            <div class="recipe-icon baguette"></div>
            <span class="recipe-name">Baguette</span>
          </div>

          <div class="recipe-card" onclick="selectRecipe('Shortcake')">
            <div class="recipe-icon shortcake"></div>
            <span class="recipe-name">Shortcake</span>
          </div>

          <div class="recipe-card" onclick="selectRecipe('Toast')">
            <div class="recipe-icon toast"></div>
            <span class="recipe-name">Toast</span>
          </div>
        </div>
      </div>

      <!-- Active Timer -->
      <div id="view-timer" class="view">
        <div class="timer-header">
          <button class="back-btn" onclick="confirmExitTimer()">
            ← Menu
          </button>
          <span id="step-badge">Step 1/5</span>
        </div>

        <div class="timer-content">
          <h2 id="phase-title">Mixing Ingredients...</h2>
          <div id="selected-recipe-badge">Croissant</div>
          <!-- illustration placeholder -->
          <div id="phase-illustration"></div>
          <div id="time-display">25:00</div>
        </div>

        <div class="timer-controls">
          <button
            id="action-btn"
            class="timer-btn primary"
            onclick="toggleTimer()"
          >
            Start
          </button>
          <button
            id="skip-btn"
            class="timer-btn secondary"
            onclick="skipPhase()"
          >
            Skip ⏭
          </button>
        </div>
      </div>

      <!-- 3rd Break Branching Page -->
      <div id="view-branch" class="view">
        <div class="branch-content">
          <h2>Freshly Baked! 🥐</h2>
          <p>
            You finished enjoying your treat. What would you like to do next?
          </p>

          <div class="branch-options">
            <button class="branch-btn primary" onclick="makeChoice('bake')">
              <span>👩‍🍳</span>
              <span>Bake Something New</span>
            </button>

            <button class="branch-btn secondary" onclick="makeChoice('cafe')">
              <span>☕</span>
              <span>Stay in Cafe</span>
            </button>
          </div>
        </div>
      </div>

      <div id="custom-modal" class="modal-overlay">
        <div class="modal-box">
          <h3>Leave Kitchen?</h3>
          <p>Your current baking progress will <strong>reset</strong>.</p>
          <div class="modal-buttons">
            <button class="modal-btn secondary" onclick="closeModal()">Stay</button>
            <button class="modal-btn primary" onclick="confirmExit()">Exit</button>
          </div>
        </div>
      </div>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
