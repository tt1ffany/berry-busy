<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Berry Busy</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div id="widget-container">
      <!-- Start Page -->
      <div id="view-start" class="view active">
        <div id="storefront-bg">
          <div id="bakery-door" onclick="showMenu()"></div>
        </div>
      </div>

      <!-- Menu Page -->
      <div id="view-menu" class="view">
        <div class="menu-header">
          <button class="back-btn" onclick="showView('view-start')">
            ← Exit
          </button>
          <h2>Select Recipe</h2>
        </div>

        <!-- <div class="recipe-card" onclick="selectRecipe()">
          <div class="recipe-icon"></div>
          <span class="recipe-name"></span>
        </div> -->

        <div class="recipe-grid">
          <div class="recipe-card" onclick="selectRecipe('Croissant')">
            <div class="recipe-icon croissant"></div>
            <span class="recipe-name">Croissant</span>
          </div>

          <div class="recipe-card" onclick="selectRecipe('Baguette')">
            <div class="recipe-icon baguette"></div>
            <span class="recipe-name">Baguette</span>
          </div>

          <div class="recipe-card" onclick="selectRecipe('Shortcake')">
            <div class="recipe-icon shortcake"></div>
            <span class="recipe-name">Shortcake</span>
          </div>

          <div class="recipe-card" onclick="selectRecipe('Toast')">
            <div class="recipe-icon toast"></div>
            <span class="recipe-name">Toast</span>
          </div>
        </div>
      </div>

      <!-- Active Timer -->
      <div id="view-timer" class="view">
        <button class="back-btn" onclick="showView('view-menu')">
          ← Menu
        </button>
        <h2 id="phase-title">Mixing Ingredients...</h2>
        <div id="time-display">25:00</div>
        <button id="action-btn">Start</button>
      </div>

      <!-- 3rd Break Branching Page -->
      <div id="view-branch" class="view">
        <h2>What's next on the agenda?</h2>
        <button onclick="makeChoice('cafe')">Stay in Cafe</button>
        <button onclick="makeChoice('bake')">Back to Baking</button>
      </div>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
