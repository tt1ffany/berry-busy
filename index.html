<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Berry Busy</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div id="widget-container">
      <!-- Start Page -->
      <div id="view-start" class="view active">
        <div id="storefront-bg">
          <div id="bakery-door" onclick="showMenu()"></div>
        </div>
      </div>

      <!-- Menu Page -->
      <div id="view-menu" class="view">
        <div class="menu-header">
          <button class="back-btn" onclick="showView('view-start')">
            ← Exit
          </button>
          <h2>Select Recipe</h2>
        </div>

        <div id="recipe-grid" class="recipe-grid"></div>

        <div class="menu-footer">
          <button
            id="prev-page"
            class="page-btn"
            onclick="changeRecipePage(-1)"
          >
            ←
          </button>
          <span id="page-number">1/1</span>
          <button id="next-page" class="page-btn" onclick="changeRecipePage(1)">
            →
          </button>
        </div>
      </div>

      <!-- Active Timer -->
      <div id="view-timer" class="view">
        <div class="timer-header">
          <button class="back-btn" onclick="confirmExitTimer()">← Menu</button>
          <span id="step-badge">Step 1/5</span>
        </div>

        <div class="timer-content">
          <h2 id="phase-title">Mixing Ingredients...</h2>
          <div id="selected-recipe-badge">Croissant</div>
          <!-- illustration placeholder -->
          <div id="phase-illustration"></div>
          <div id="time-display">25:00</div>
        </div>

        <div class="timer-controls">
          <button
            id="action-btn"
            class="timer-btn primary"
            onclick="toggleTimer()"
          >
            Start
          </button>
          <button
            id="skip-btn"
            class="timer-btn secondary"
            onclick="skipPhase()"
          >
            Skip ⏭
          </button>
        </div>

        <!-- Audio Controls -->
        <div class="audio-control-bar">
          <button id="mute-btn" class="audio-icon-btn" onclick="toggleMute()" title="Mute/Unmute">🔊</button>
          <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.5" oninput="handleVolumeChange(this.value)">
          <button class="audio-icon-btn" onclick="openSoundMenu()" title="Ambience Sound">🎵</button>
        </div>
      </div>

      <!-- 3rd Break Branching Page -->
      <div id="view-branch" class="view">
        <div class="branch-content">
          <h2>Freshly Baked! 🥐</h2>
          <p>
            You finished enjoying your treat. What would you like to do next?
          </p>

          <div class="branch-options">
            <button class="branch-btn primary" onclick="makeChoice('bake')">
              <span>👩‍🍳</span>
              <span>Bake Something New</span>
            </button>

            <button class="branch-btn secondary" onclick="makeChoice('cafe')">
              <span>☕</span>
              <span>Stay in Cafe</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Confirm Exit Modal -->
      <div id="custom-modal" class="modal-overlay">
        <div class="modal-box">
          <h3>Leave Kitchen?</h3>
          <p>Your current baking progress will <strong>reset</strong>.</p>
          <div class="modal-buttons">
            <button class="modal-btn secondary" onclick="closeModal()">
              Stay
            </button>
            <button class="modal-btn primary" onclick="confirmExit()">
              Exit
            </button>
          </div>
        </div>
      </div>

      <!-- Ambient Sound Menu Modal -->
      <div id="sound-modal" class="modal-overlay">
        <div class="modal-box sound-menu-box">
          <h3>Ambience Sound</h3>

          <div class="sound-options-grid">
            <button class="sound-opt-btn active" data-sound="none" onclick="selectSound('none')">🚫 Off</button>
            <button class="sound-opt-btn" data-sound="cafe" onclick="selectSound('cafe')">☕ Cafe</button>
            <button class="sound-opt-btn" data-sound="rain" onclick="selectSound('rain')">🌧️ Rain</button>
            <button class="sound-opt-btn" data-sound="waves" onclick="selectSound('waves')">🌊 Waves</button>
            <button class="sound-opt-btn" data-sound="forest" onclick="selectSound('forest')">🌲 Forest</button>
            <button class="sound-opt-btn" data-sound="campfire" onclick="selectSound('campfire')">🔥 Campfire</button>
          </div>

          <button class="modal-btn primary" onclick="closeSoundMenu()">Done</button>
        </div>
      </div>

      <!-- Window Control Buttons -->
      <div id="window-controls">
        <button
          class="win-control-btn"
          onclick="minimizeWindow()"
          title="Minimize"
        >
          —
        </button>
        <button
          class="win-control-btn close"
          onclick="closeWindow()"
          title="Close"
        >
          ✕
        </button>
      </div>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
